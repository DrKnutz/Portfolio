    <div id="modal-pdf" class="modal">
        <div class="contenu-modal">
            <span class="fermer">&times;</span>
            <iframe id="iframe-pdf" src=""></iframe>
        </div>
    </div>

    <script>
        const modal = document.getElementById("modal-pdf");
        const boutonFermer = document.querySelector(".fermer");
        const iframe = document.getElementById("iframe-pdf");
        const liensPdf = document.querySelectorAll(".lien-pdf");

        liensPdf.forEach(lien => {
            lien.addEventListener("click", function (event) {
                event.preventDefault();
                iframe.src = this.getAttribute("href");
                modal.style.display = "block";
            });
        });

        function fermerModal() {
            modal.style.display = "none";
            iframe.src = "";
        }

        boutonFermer.onclick = fermerModal;

        window.onclick = function (event) {
            if (event.target === modal) fermerModal();
        }

        const footers = document.querySelectorAll('.carte-footer');
        footers.forEach(footer => {
            const toggleBtn = footer.querySelector('.footer-toggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    footer.classList.toggle('ouvert');
                });
            }
        });


        //multilingue//
        let currentLang = localStorage.getItem('languePortfolio') || 'fr';

        const btnFr = document.getElementById('btn-fr');
        const btnEn = document.getElementById('btn-en');

        fetch('trad.json')
            .then(response => response.json())
            .then(translations => {

                function setLanguage(lang) {
                    document.querySelectorAll('[data-i18n]').forEach(el => {
                        const key = el.getAttribute('data-i18n');

                        if (translations[lang] && translations[lang][key]) {
                            if (el.getAttribute('data-i18n-target') === 'alt') {
                                el.setAttribute('alt', translations[lang][key]);
                            } else {
                                el.innerHTML = translations[lang][key];
                            }
                        }
                    });

                    localStorage.setItem('languePortfolio', lang);
                }

                if (btnFr) {
                    btnFr.addEventListener('click', () => setLanguage('fr'));
                }
                if (btnEn) {
                    btnEn.addEventListener('click', () => setLanguage('en'));
                }

                setLanguage(currentLang);
            });

    </script>
